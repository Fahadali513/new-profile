<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Nexa Admin</title>
<link rel="icon" href="../assets/images/logo.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
<div class="backdrop" aria-hidden="true"></div>

<div class="admin-shell">
  <aside class="admin-side" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Projects</h1>
        <p>Add, edit, feature and order the work shown on the public site.</p>
      </div>
      <button class="btn btn--primary" id="addProjectBtn">+ Add Project</button>
    </div>

    <div class="admin-panel">
      <table class="admin-table">
        <thead>
          <tr><th>Image</th><th>Name</th><th>Category</th><th>Status</th><th>Order</th><th>Actions</th></tr>
        </thead>
        <tbody id="projectsTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add / Edit project modal -->
<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <div class="modal__head">
      <h2 id="projectModalTitle">Add Project</h2>
      <button class="modal__close" id="projectModalClose" aria-label="Close">✕</button>
    </div>
    <form id="projectForm">
      <div class="admin-form">
        <div class="full">
          <label for="pf-name">Project Name</label>
          <input type="text" id="pf-name" name="name" required>
        </div>
        <div>
          <label for="pf-category">Category</label>
          <input type="text" id="pf-category" name="category" placeholder="e.g. e-commerce" required>
        </div>
        <div>
          <label for="pf-status">Status</label>
          <select id="pf-status" name="status">
            <option value="published">Published</option>
            <option value="draft">Draft</option>
          </select>
        </div>
        <div class="full">
          <label for="pf-description">Description</label>
          <textarea id="pf-description" name="description" required></textarea>
        </div>
        <div class="full">
          <label for="pf-technologies">Technologies (comma-separated)</label>
          <input type="text" id="pf-technologies" name="technologies" placeholder="React, Node.js, MongoDB">
        </div>
        <div class="full">
          <label for="pf-image">Image URL</label>
          <input type="url" id="pf-image" name="image" placeholder="https://...">
        </div>
        <div>
          <label for="pf-demo">Demo URL</label>
          <input type="url" id="pf-demo" name="demoUrl">
        </div>
        <div>
          <label for="pf-github">GitHub URL</label>
          <input type="url" id="pf-github" name="githubUrl">
        </div>
        <div>
          <label for="pf-order">Display Order</label>
          <input type="number" id="pf-order" name="order" min="1">
        </div>
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="projectModalCancel">Cancel</button>
        <button type="submit" class="btn btn--primary">Save Project</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/storage.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
